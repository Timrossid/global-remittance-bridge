name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-api:
    name: Test Payment API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: payment-api/package-lock.json

      - name: Install dependencies
        working-directory: payment-api
        run: npm ci

      - name: Run unit tests
        working-directory: payment-api
        run: npm test

  test-dashboard:
    name: Test Merchant Dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: merchant-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: merchant-dashboard
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: merchant-dashboard
        run: npx playwright install --with-deps chromium

      - name: Run dashboard smoke tests
        working-directory: merchant-dashboard
        env:
          NEXT_PUBLIC_API_URL: 'http://127.0.0.1:3001'
          NEXT_PUBLIC_NETWORK: 'testnet'
          NEXT_PUBLIC_CONTRACT_ID: 'CBL3I4IDMIUZJEJG56DV2VP6K7L2ROLT3JYCC53KNU7PPUX6DGPJJVKC'
          NEXT_PUBLIC_ESCROW_TOKEN_ID: 'CBBH6JHHNKAC4E444EIYG3HGNPYLVFLY72OMRYCCLFZU4ASVU3AO73QR'
          NEXT_PUBLIC_ENABLE_TEST_WALLET_MOCK: 'true'
        run: npm test
