repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: '^contracts/'
      - id: check-toml
        exclude: '^contracts/'
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: '^contracts/'
      - id: forbid-new-submodules

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: ['--disable=MD013', '--disable=MD033']
        exclude: 'node_modules|contracts/'

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.16.0
    hooks:
      - id: eslint
        files: '\.(ts|tsx|js|jsx)$'
        exclude: 'node_modules|\.next/|dist/'
        additional_dependencies:
          - 'eslint@9.16.0'
          - '@typescript-eslint/parser@7.18.0'
          - '@typescript-eslint/eslint-plugin@7.18.0'

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [markdown, yaml, json, toml]
        exclude: 'node_modules|contracts/Cargo.toml$'

  - repo: https://github.com/rust-lang/pre-commit-hooks
    rev: v0.6.4
    hooks:
      - id: rustfmt
        files: '\.rs$'
      - id: clippy
        files: '\.rs$'
        args: ['--all-targets', '--', '-D', 'warnings']
        additional_dependencies:
          - 'clippy'

  - repo: https://github.com/compilerla/conventional-pre-commit-linter
    rev: v2.4.0
    hooks:
      - id: conventional-pre-commit-linter
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
