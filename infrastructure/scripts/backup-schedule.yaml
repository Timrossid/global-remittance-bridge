apiVersion: batch/v1
kind: CronJob
metadata:
  name: database-backup
  namespace: remittance-bridge
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: postgres:15-alpine
              command:
                - /bin/sh
                - -c
                - |
                  pg_dump -U remittance -h postgres payment_api | gzip > /backups/payment_api_$(date +%Y%m%d_%H%M%S).sql.gz
                  find /backups -name "payment_api_*.sql.gz" -mtime +7 -delete
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          restartPolicy: OnFailure
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-pvc
