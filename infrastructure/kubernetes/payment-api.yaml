apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: remittance-bridge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: payment-api
          image: ghcr.io/global-micro-remittance-bridge/payment-api:latest
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              value: postgresql://remittance:changeme@postgres:5432/payment_api
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: payment-api-secret
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: remittance-bridge
spec:
  ports:
    - port: 80
      targetPort: 3001
  selector:
    app: payment-api
