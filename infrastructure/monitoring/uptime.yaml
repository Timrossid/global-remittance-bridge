apiVersion: v1
kind: ConfigMap
metadata:
  name: uptime-monitor
  namespace: remittance-bridge
data:
  config.yml: |
    monitors:
      - name: Payment API
        url: http://payment-api/health
        method: GET
        expected_status: 200
        check_interval: 30s
        timeout: 10s
        retries: 3

      - name: Stellar RPC
        url: https://soroban-testnet.stellar.org
        method: GET
        expected_status: 200
        check_interval: 60s
        timeout: 15s
        retries: 3
