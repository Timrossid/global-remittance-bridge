apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: remittance-bridge
data:
  dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Remittance Bridge Overview",
        "tags": ["remittance"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(http_requests_total[5m])",
                "legendFormat": "{{method}} {{status}}"
              }
            ]
          },
          {
            "id": 2,
            "title": "Latency P95",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))",
                "legendFormat": "P95"
              }
            ]
          }
        ]
      }
    }
