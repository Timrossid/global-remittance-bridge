apiVersion: v1
kind: ConfigMap
metadata:
  name: app-metrics
  namespace: remittance-bridge
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'payment-api'
        static_configs:
          - targets: ['localhost:3001']
        metrics_path: '/metrics'
